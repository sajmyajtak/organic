source: rozbor @organic__101_ 2026-11-06 (Business Discovery, 100 postů)
name: "Natural, simple living as an aesthetic"
description: >
  Aspirational moodboard carousels about a slower, more natural life: real food,
  seasonal and regional traditions, natural home goods, time outdoors, old-school
  habits. Nostalgic and visual rather than medical. Contrasts of then vs now and
  "this, not that" for everyday choices (food, home, rituals, leisure).
audience: "English-speaking adults 18-40 (mostly US) drawn to traditional, natural, 'simple life' aesthetics"
voice: "short, confident, warm, a little nostalgic; captions of one line plus emoji; no lecturing"
pillars:
  - name: "The art of ___ living (moodboards by country, season, place, routine)"
    share: 0.4
  - name: "Then vs now"
    share: 0.2
  - name: "This, not that (everyday swaps)"
    share: 0.2
  - name: "Natural essentials lists (kitchen, home, bathroom)"
    share: 0.15
  - name: "Lead magnet / community"
    share: 0.05
formats:
  - "6-8 slide moodboard carousel: big serif title per slide, 10-15 labelled cut-out photos"
  - "two-row then/now comparison slides, slide 1 = 'Why?'"
  - "single-image labelled list of items"
  - "last slide = call to action (free guide / community)"
avoid:
  - "vaccines, sunscreen, medication or any medical advice and disease claims"
  - "raw milk promotion"
  - "photos we have no licence for, celebrities, film stills"
  - "copying organic__101_'s titles, layouts, colours or 'maxxing' series name"
