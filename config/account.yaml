# Hlavní nastavení účtu. Vše, co tu je, čte generátor obsahu i publikační skript.
# Hodnoty označené TODO doplníme společně, jakmile bude založený účet
# a potvrzená nika (profil organic__101_ je bez přihlášení skrytý).

account:
  handle: ""                 # TODO: uživatelské jméno nového účtu (bez @)
  language: en               # obsah v angličtině
  # Časy níže jsou v časovém pásmu publika (USA, východní pobřeží).
  # Po 2 týdnech je upravíme podle toho, kdy jsou sledující online (Insights).
  timezone: America/New_York

niche:
  # ZÁSTUPNÁ HODNOTA, než nastudujeme organic__101_ (screenshoty nebo
  # `python -m igbot analyze organic__101_`). Generátor bere přednostně
  # data/niche_profile.yaml z analýzy. Texty jsou anglicky, protože jdou
  # rovnou do generátoru anglického obsahu.
  name: "Organic 101: natural whole-food living, made simple"
  description: >
    Practical, evidence-aware carousels for people who want to eat and live more
    naturally: real-food swaps, reading labels, seasonal produce, simple recipes,
    fewer unnecessary chemicals at home. No miracle claims, no fear-mongering.
  audience: "English-speaking adults 22-45 (US, UK, CA, AU), beginners in natural living"
  voice: "warm, direct, practical, short sentences, never preachy or alarmist"
  pillars:                   # obsahové pilíře a jejich podíl ve feedu
    - name: "How-to and swaps"         # uložitelné návody
      share: 0.4
    - name: "Myth vs. fact"            # sdílitelné
      share: 0.2
    - name: "Recipes and seasonal food"
      share: 0.2
    - name: "Product picks"            # monetizace (affiliate), max 1× týdně
      share: 0.1
    - name: "Community questions"
      share: 0.1
  avoid:
    - "disease or cure claims, 'detox' against illness"
    - "copying text or graphics from other accounts"
    - "fear-mongering and mocking people"
    - "raw milk promotion"

schedule:
  # Jen karusely (bez reels): 1 denně. Stories vidí jen sledující;
  # víc než ~4–5 denně prý škodí dosahu (neověřeno).
  feed_time: "11:30"
  weekly_mix:
    carousel: 7
    reel: 0
  stories_per_day: 3
  story_times: ["08:30", "13:00", "20:00"]

brand:
  background: "#F4F1EA"
  foreground: "#1F2A1F"
  accent: "#4E7D3A"
  muted: "#6B6B5E"

monetization:
  link_in_bio: ""            # TODO: odkaz na rozcestník / lead magnet
  lead_magnet: "Free PDF: 30-day real-food reset (simple swaps, no dieting)"
  ad_label: "Ad"             # povinné označení placené spolupráce / affiliate na začátku popisku
  cta_rotation:
    - "Save this so you have it next time you shop."
    - "Send this to someone who needs it."
    - "Comment which swap you'll try first."
    - "Grab the free PDF from the link in bio."

competitors:
  # Výchozí seznam účtů pro analýzu přes oficiální Business Discovery API.
  # Skript `discover` z jejich veřejných popisků najde další kandidáty.
  seeds:
    - organic__101_

generation:
  model: claude-opus-5-5
  effort: medium
  # false = koncepty čekají na schválení (doporučeno prvních 30 dní),
  # true = generátor rovnou plánuje k publikaci.
  auto_approve: false
