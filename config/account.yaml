# Hlavní nastavení účtu. Vše, co tu je, čte generátor obsahu i publikační skript.
# Hodnoty označené TODO doplníme společně, jakmile bude založený účet
# a potvrzená nika (profil organic__101_ je bez přihlášení skrytý).

account:
  handle: "naturizz"
  ig_user_id: "17841466729247229"   # ID z Graph API (není tajné)
  language: en               # obsah v angličtině
  # Časy níže jsou v časovém pásmu publika (USA, východní pobřeží).
  # Po 2 týdnech je upravíme podle toho, kdy jsou sledující online (Insights).
  timezone: America/New_York

niche:
  # Podle rozboru @organic__101_ (reports/organic__101_/2026-11-06.md).
  # Generátor navíc čte data/niche_profile.yaml.
  name: "naturizz: the art of natural, simple living"
  description: >
    Aesthetic moodboard carousels about a slower, more natural life: real food,
    seasonal and regional traditions, natural home essentials, time outdoors,
    old-school habits. Nostalgic and visual, never medical.
  audience: "English-speaking adults 18-40, mostly US, into natural and 'simple life' aesthetics"
  voice: "short, confident, warm, slightly nostalgic; one-line captions with an emoji"
  pillars:
    - name: "The art of ___ living (moodboards)"
      share: 0.4
    - name: "Then vs now"
      share: 0.2
    - name: "This, not that"
      share: 0.2
    - name: "Natural essentials lists"
      share: 0.15
    - name: "Free guide / community"
      share: 0.05
  avoid:
    - "medical advice, vaccines, sunscreen, medication, disease or cure claims"
    - "raw milk promotion"
    - "unlicensed photos, celebrities, film stills"
    - "copying organic__101_'s titles, layouts, colours or 'maxxing' naming"

schedule:
  # Jen karusely (bez reels): 1 denně. Stories vidí jen sledující;
  # víc než ~4–5 denně prý škodí dosahu (neověřeno).
  feed_time: "11:30"
  weekly_mix:
    carousel: 7
    reel: 0
  stories_per_day: 3
  story_times: ["08:30", "13:00", "20:00"]

brand:
  # Styl „sticker“ (vybraný 7. 11. 2026): kraftový papír, tmavě hnědé písmo, rezavý akcent.
  # Používá ho koláž (igbot/collage.py) i textové slidy a stories (igbot/render.py).
  background: "#E5D5BA"
  foreground: "#3A2517"
  accent: "#9C4F28"
  muted: "#6B5A48"

monetization:
  link_in_bio: ""            # TODO: odkaz na rozcestník / lead magnet
  lead_magnet: "Free PDF: 30-day real-food reset (simple swaps, no dieting)"
  ad_label: "Ad"             # povinné označení placené spolupráce / affiliate na začátku popisku
  cta_rotation:
    - "Save this so you have it next time you shop."
    - "Send this to someone who needs it."
    - "Comment which swap you'll try first."
    - "Grab the free PDF from the link in bio."

competitors:
  # Výchozí seznam účtů pro analýzu přes oficiální Business Discovery API.
  # Skript `discover` z jejich veřejných popisků najde další kandidáty.
  seeds:
    - organic__101_

generation:
  model: claude-opus-5-5
  effort: medium
  # false = koncepty čekají na schválení (doporučeno prvních 30 dní),
  # true = generátor rovnou plánuje k publikaci.
  auto_approve: false
