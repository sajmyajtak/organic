name: Analýza účtu

# Ruční spuštění: projde posty zadaného účtu přes oficiální Business Discovery
# API, Claude je vyhodnotí a report se uloží do reports/<účet>/.
on:
  workflow_dispatch:
    inputs:
      username:
        description: "Instagram účet (bez @)"
        required: true
        default: "organic__101_"
      limit:
        description: "Kolik posledních postů projít"
        default: "60"

concurrency:
  group: content-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Analyzovat
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m igbot analyze "${{ inputs.username }}" --limit "${{ inputs.limit }}"
      - name: Uložit report
        run: |
          git config user.name "igbot"
          git config user.email "igbot@users.noreply.github.com"
          git add reports data
          git diff --cached --quiet && exit 0
          git commit -m "analýza: @${{ inputs.username }} $(date -u +%F)"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
