name: Publikace

# GitHub pouští naplánované běhy jen jednou za 4–8 h, ať je cron jakýkoli. Proto běh
# jen nezkontroluje frontu: počká na okna plánovače (igbot/scheduler.py) a publikuje
# přesně v nich, každý post hned pushne, mezitím každých 30 min přečte rozhodnutí
# z KLAPKY. Když další dnešní okno připadne až za konec běhu (5,5 h), spustí další
# běh sám, takže řetěz pokryje den; v noci skončí a ráno ho nastartuje cron.
# Veřejný repozitář: minuty Actions jsou zdarma.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Jen zkouška (nic nepublikovat)"
        type: boolean
        default: true
      wait:
        description: "Kolik minut čekat na okna plánovače"
        type: string
        default: "330"

concurrency:
  group: content-queue
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # spustit další běh řetězu (workflow_dispatch přes GITHUB_TOKEN)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publikovat
        id: publish
        env:
          IGBOT_GIT_COMMIT: "1"   # každý post hned commitnout a pushnout
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          MEDIA_BACKEND: ${{ vars.MEDIA_BACKEND }}
          MEDIA_BRANCH: ${{ github.ref_name }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}   # KLAPKA; bez něj se sync přeskočí
        run: |
          if [ -z "$IG_USER_ID" ]; then echo "Účet zatím není připojený (chybí secret IG_USER_ID)."; exit 0; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m igbot publish --dry-run
          else
            python -m igbot publish --wait "${{ inputs.wait || '330' }}"
          fi
      - name: Uložit stav fronty
        if: always()
        run: |
          git config user.name "igbot"
          git config user.email "igbot@users.noreply.github.com"
          git add content
          git diff --cached --quiet && exit 0
          git commit -m "content: publikace $(date -u +%F\ %H:%M)"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
      - name: Spustit další běh (další dnešní okno je až po konci tohoto)
        if: ${{ steps.publish.outputs.next != '' && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}" -f dry_run=false
