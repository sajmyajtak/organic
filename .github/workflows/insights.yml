name: Statistiky

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: content-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Stáhnout statistiky
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
        run: python -m igbot insights
      - name: Uložit
        run: |
          git config user.name "igbot"
          git config user.email "igbot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: statistiky $(date -u +%F)"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
